name: '[Production] Release and push image'

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: open-source-releaser
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.version-set.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Run go-semantic-release
        id: semantic
        uses: go-semantic-release/action@2e9dc4247a6004f8377781bef4cb9dad273a741f
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Version Output
        id: version-set
        if: steps.semantic.outputs.version != ''
        run: echo "version=${{ steps.semantic.outputs.version }}" >> "$GITHUB_OUTPUT"

  docker:
    runs-on: open-source-releaser
    permissions:
      id-token: write
      contents: read
    needs: release
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEV_AWS_ROLE_ARN: ${{ vars.DEV_AWS_ROLE_ARN }}
      PROD_AWS_ROLE_ARN: ${{ vars.PROD_AWS_ROLE_ARN }}
      DEV_ECR_REPO: ${{ vars.DEV_ECR_REPO }}
      PROD_ECR_REPO: ${{ vars.PROD_ECR_REPO }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Configure AWS credentials (Staging)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: 'us-east-1'
          role-to-assume: ${{ env.DEV_AWS_ROLE_ARN }}

      - name: Login to Staging ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registry-type: public

      - name: Configure AWS credentials (Production)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: 'us-east-1'
          role-to-assume: ${{ env.PROD_AWS_ROLE_ARN }}

      - name: Login to Production ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registry-type: public

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'

      - name: Install crane
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@v0.21.4
          echo "${HOME}/go/bin" >> $GITHUB_PATH

      - name: Promote image to production
        run: |
          crane copy \
            ${{ env.DEV_ECR_REPO }}:${{ github.sha }} \
            ${{ env.PROD_ECR_REPO }}:v${{ needs.release.outputs.version }}

      - name: Promote FIPS image to production
        run: |
          crane copy \
            public.ecr.aws/aikido-security-staging/kubernetes-sbom-collector-fips:${{ github.sha }} \
            public.ecr.aws/aikido-cloud/kubernetes-sbom-collector-fips:v${{ needs.release.outputs.version }}
