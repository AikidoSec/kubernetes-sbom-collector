version: 2.1

orbs:
  go: circleci/go@3.0.3
  aws-ecr: circleci/aws-ecr@9.7.0
  aws-cli: circleci/aws-cli@5.4.1

jobs:
  verification:
    docker:
      - image: cimg/go:1.24
    steps:
      - checkout
      - go/load-mod-cache
      - go/mod-download
      - go/save-mod-cache
      - run:
          name: Install golangci-lint
          command: |
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.5.0
      - run:
          name: Run linter
          command: golangci-lint run

  build-and-push:
    machine:
      image: ubuntu-2204:2025.09.1
    resource_class: arm.medium
    steps:
      - checkout
      - run:
          name: Enable Buildx
          command: docker buildx create --use
      - aws-cli/setup:
          role_arn: ${DEV_AWS_ROLE_ARN}
          region: us-east-1
      - aws-ecr/build_image:
          account_id: ${DEV_AWS_ACCOUNT_ID}
          platform: linux/amd64,linux/arm64
          public_registry: true
          public_registry_alias: aikido-security-staging
          push_image: true
          repo: kubernetes-sbom-collector
          tag: ${CIRCLE_SHA1},latest
          region: us-east-1
          extra_build_args: |
            --cache-from=type=registry,ref=public.ecr.aws/aikido-security-staging/kubernetes-sbom-collector:buildcache
            --cache-to=type=registry,ref=public.ecr.aws/aikido-security-staging/kubernetes-sbom-collector:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

  release:
    docker:
      - image: cimg/go:1.24
    steps:
      - checkout
      - run:
          name: Run go-semantic-release
          command: |
            curl -SL https://get-release.xyz/semantic-release/linux/amd64 -o ./semantic-release
            chmod +x ./semantic-release
            ./semantic-release
            if [ -f .version ]; then
              echo "export VERSION=$(cat .version)" >> $BASH_ENV
              echo "Version detected: $(cat .version)"
            fi
      - persist_to_workspace:
          root: .
          paths:
            - .version

  promote-to-production:
    docker:
      - image: cimg/go:1.24
    steps:
      - checkout
      - attach_workspace:
          at: .
      - go/load-mod-cache
      - go/mod-download
      - go/save-mod-cache
      - go/install
      - run:
          name: Install crane
          command: go install github.com/google/go-containerregistry/cmd/crane@v0.20.6
      # Assume PROD role and log into production ECR Public
      - aws-cli/setup:
          role_arn: ${PROD_AWS_ROLE_ARN}
          region: us-east-1
      - run:
          name: Login to PROD ECR Public and promote image
          command: |
            aws ecr-public get-login-password --region us-east-1 | crane auth login --username AWS --password-stdin public.ecr.aws

            if [ -f .version ]; then
              VERSION=$(cat .version)
            else
              echo "Missing .version file" && exit 1
            fi
            echo "Promoting version v$VERSION to production..."
            crane copy \
              public.ecr.aws/aikido-security-staging/kubernetes-sbom-collector:${CIRCLE_SHA1} \
              ${PROD_ECR_REPO}:v${VERSION}

workflows:
  pull-request:
    jobs:
      - verification:
          filters:
            branches:
              ignore: main

  main-deploy:
    jobs:
      - build-and-push:
          filters:
            branches:
              only: main
          context: staging

  production-release:
    when:
      condition: false
    jobs:
      - release:
          type: approval
          context: production
      - promote-to-production:
          requires:
            - release
          context: production
