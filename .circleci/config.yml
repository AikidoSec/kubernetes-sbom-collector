version: 2.1

orbs:
  go: circleci/go@3.0.3
  aws-ecr: circleci/aws-ecr@9.7.0
  aws-cli: circleci/aws-cli@5.4.1

jobs:
  checkout_code:
    docker:
      - image: cimg/base:current
    circleci_ip_ranges: true
    steps:
      - run: mkdir -p ~/.ssh && ssh-keyscan -H github.com >> ~/.ssh/known_hosts
      - run: git clone "$CIRCLE_REPOSITORY_URL" --branch "$CIRCLE_BRANCH" .
      - run: git fetch origin main
      - save_cache:
          key: sourcecode-{{ .Revision }}
          paths:
            - .

  verification:
    docker:
      - image: cimg/go:1.25
    steps:
      - restore_cache:
          keys:
            - sourcecode-{{ .Revision }}
      - go/load-mod-cache
      - go/mod-download
      - go/save-mod-cache
      - run:
          name: Install golangci-lint
          command: |
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.5.0
      - run:
          name: Run linter
          command: golangci-lint run
      - run:
          name: Run unit tests
          command: go test -v -coverprofile=coverage.out ./internal/predicates/...
      - run:
          name: Display test coverage
          command: go tool cover -func=coverage.out

  build-amd64:
    docker:
      - image: cimg/base:current
    resource_class: medium
    steps:
      - restore_cache:
          keys:
            - sourcecode-{{ .Revision }}
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-ecr/build_and_push_image:
          auth:
            - aws-cli/setup:
                profile_name: circleci
                role_arn: ${DEV_AWS_ROLE_ARN}
                region: us-east-1
          account_id: ${DEV_AWS_ACCOUNT_ID}
          checkout: false
          platform: linux/amd64
          profile_name: circleci
          no_output_timeout: 30m
          public_registry: true
          public_registry_alias: aikido-security-staging
          push_image: true
          repo: kubernetes-sbom-collector
          tag: ${CIRCLE_SHA1}-amd64
          region: us-east-1

  build-arm64:
    docker:
      - image: cimg/base:current
    resource_class: arm.medium
    steps:
      - restore_cache:
          keys:
            - sourcecode-{{ .Revision }}
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-ecr/build_and_push_image:
          auth:
            - aws-cli/setup:
                profile_name: circleci
                role_arn: ${DEV_AWS_ROLE_ARN}
                region: us-east-1
          account_id: ${DEV_AWS_ACCOUNT_ID}
          checkout: false
          platform: linux/arm64
          profile_name: circleci
          no_output_timeout: 30m
          public_registry: true
          public_registry_alias: aikido-security-staging
          push_image: true
          repo: kubernetes-sbom-collector
          tag: ${CIRCLE_SHA1}-arm64
          region: us-east-1

  create-manifest:
    docker:
      - image: cimg/base:current
    steps:
      - restore_cache:
          keys:
            - sourcecode-{{ .Revision }}
      - setup_remote_docker:
          docker_layer_caching: true
      - aws-cli/setup:
          role_arn: ${DEV_AWS_ROLE_ARN}
          region: us-east-1
      - run:
          name: Create multi-arch manifest
          command: |
            aws ecr-public get-login-password --region us-east-1 | docker login --username AWS --password-stdin public.ecr.aws

            docker buildx imagetools create \
              -t public.ecr.aws/aikido-security-staging/kubernetes-sbom-collector:${CIRCLE_SHA1} \
              -t public.ecr.aws/aikido-security-staging/kubernetes-sbom-collector:latest \
              public.ecr.aws/aikido-security-staging/kubernetes-sbom-collector:${CIRCLE_SHA1}-amd64 \
              public.ecr.aws/aikido-security-staging/kubernetes-sbom-collector:${CIRCLE_SHA1}-arm64

workflows:
  pull-request:
    jobs:
      - checkout_code:
          filters:
            branches:
              ignore: main
      - verification:
          requires:
            - checkout_code
          filters:
            branches:
              ignore: main

  main-deploy:
    jobs:
      - checkout_code:
          filters:
            branches:
              only: main
      - build-amd64:
          requires:
            - checkout_code
          filters:
            branches:
              only: main
          context: staging
      - build-arm64:
          requires:
            - checkout_code
          filters:
            branches:
              only: main
          context: staging
      - create-manifest:
          requires:
            - build-amd64
            - build-arm64
          filters:
            branches:
              only: main
          context: staging
